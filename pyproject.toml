[project]
name = "bored-machines"
version = "0.1.0"
description = "Bored Machines speedrun: curious agents walk Sentinel-2 tiles, small DDPMs dream their paths"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch>=2.8",
    "torchvision>=0.23",
    "numpy>=2.0",
    "pandas>=2.2",
    "pyarrow>=17",
    "pillow>=10",
    "scikit-learn>=1.5",
    "pyyaml>=6",
    "matplotlib>=3.9",
    "tqdm>=4.66",
    "fsspec>=2024.6",
    "aiohttp>=3.9",
    "requests>=2.32",
    "huggingface-hub>=0.25",
    "diffusers>=0.32",
    "nbformat>=5.10",
    "nbconvert>=7.16",
    "ipykernel>=6.29",
    "global-land-mask>=1.0",
    "imageio>=2.30",
    "imageio-ffmpeg>=0.5",
]

[tool.uv]
package = false
index-strategy = "unsafe-best-match"

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }
