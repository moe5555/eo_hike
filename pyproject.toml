[project]
name = "hiker"
version = "0.1.0"
description = "Agentic novelty search over a satellite image archive"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch>=2.8",
    "torchvision>=0.23",
    "torchgeo>=0.10",
    "open-clip-torch>=2.30",
    "faiss-cpu>=1.9",
    "numpy>=2.0",
    "pandas>=2.2",
    "pyarrow>=17",
    "pillow>=10",
    "rasterio>=1.4",
    "pyproj>=3.6",
    "tqdm>=4.66",
    "typer>=0.12",
    "pyyaml>=6",
    "matplotlib>=3.9",
    "zarr>=3.0",
    "numcodecs>=0.15",
    "fsspec>=2024.6",
    "aiohttp>=3.9",
    "requests>=2.32",
    "huggingface-hub>=0.25",
    "timm>=1.0",
    "global-land-mask>=1.0.0",
    "diffusers>=0.32",
    "transformers>=4.45",
    "accelerate>=1.0",
    "peft>=0.13",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.uv]
index-strategy = "unsafe-best-match"

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hiker"]

[tool.pytest.ini_options]
testpaths = ["tests"]
