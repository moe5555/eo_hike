# Smoke test: EuroSAT RGB, 95 MB, 27k chips of 64 px, no coordinates, no dates.
# Geo and time fields in the log will be null; that is expected for this archive.

dataset:
  name: eurosat
  key: eurosat-rgb
  limit: null                  # cap the number of chips for a faster smoke test
  download: true

encoder:
  name: clip_vit_b32
  batch_size: 256
  device: auto
  center: true                 # subtract archive-mean embedding, renormalise (see decisions.md)

index:
  type: flat_ip

agents:
  n_agents: 2
  seed: 7
  start_chips: null
  k_neighbours: 50
  m_random: 5
  j_history: 15
  temperature: 0.05
  max_steps: 200
  boredom_window: 20
  boredom_threshold: 0.4

outputs:
  runs_dir: runs
  write_images: true
  image_format: png
